name: Isolated PR513 setup witness
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: isolated-513-setup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  setup-witness:
    if: github.sha == inputs.expected_sha
    runs-on: ubuntu-26.04
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - name: Install only Playwright 1.65 WebKit and tools OS dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS}" = true
          test "${GITHUB_REPOSITORY}" = soliskit/tetris-js
          test "${{ github.sha }}" = "${{ inputs.expected_sha }}"
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
          test "$(uname -m)" = x86_64
          # Exact ordered package groups from playwright-core 1.65.0:
          # ubuntu26.04-x64 webkit, then tools; no Chromium/Firefox group.
          # Versions/transitive packages are resolved by the runner's apt mirrors.
          sudo -n -- /usr/bin/env DEBIAN_FRONTEND=noninteractive /bin/sh -c '
            set -eu
            apt-get update
            apt-get install -y --no-install-recommends \
              gstreamer1.0-libav \
              gstreamer1.0-plugins-bad \
              gstreamer1.0-plugins-base \
              gstreamer1.0-plugins-good \
              libicu78 \
              libatomic1 \
              libatk-bridge2.0-0t64 \
              libatk1.0-0t64 \
              libcairo-gobject2 \
              libcairo2 \
              libdbus-1-3 \
              libdrm2 \
              libenchant-2-2 \
              libepoxy0 \
              libevent-2.1-7t64 \
              libflite1 \
              libfontconfig1 \
              libfreetype6 \
              libgbm1 \
              libgdk-pixbuf-2.0-0 \
              libgles2 \
              libglib2.0-0t64 \
              libgstreamer-gl1.0-0 \
              libgstreamer-plugins-bad1.0-0 \
              libgstreamer-plugins-base1.0-0 \
              libgstreamer1.0-0 \
              libgtk-4-1 \
              libharfbuzz-icu0 \
              libharfbuzz0b \
              libhyphen0 \
              libjpeg-turbo8 \
              liblcms2-2 \
              libmanette-0.2-0 \
              libopus0 \
              libpango-1.0-0 \
              libpangocairo-1.0-0 \
              libpng16-16t64 \
              libsecret-1-0 \
              libvpx12 \
              libwayland-client0 \
              libwayland-egl1 \
              libwayland-server0 \
              libwebp7 \
              libwebpdemux2 \
              libwoff1 \
              libx11-6 \
              libxkbcommon0 \
              libxml2-16 \
              libxslt1.1 \
              libx264-165 \
              libavif16 \
              xvfb \
              fonts-noto-color-emoji \
              fonts-unifont \
              xfonts-cyrillic \
              xfonts-scalable \
              fonts-liberation \
              fonts-ipafont-gothic \
              fonts-wqy-zenhei \
              fonts-tlwg-loma-otf \
              fonts-freefont-ttf
          '
      - name: One bounded targeted witness, no qualification claim
        env:
          DIAGNOSTIC_EXPECTED_SHA: ${{ inputs.expected_sha }}
          DIAGNOSTIC_EXPECTED_REF: ${{ github.ref }}
        run: python3 -I .github/diagnostic-513/controller.py
