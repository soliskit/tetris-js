name: Isolated PR513 setup witness
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: isolated-513-setup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  setup-witness:
    if: github.sha == inputs.expected_sha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - name: One bounded targeted witness, no qualification claim
        env:
          DIAGNOSTIC_EXPECTED_SHA: ${{ inputs.expected_sha }}
          DIAGNOSTIC_EXPECTED_REF: ${{ github.ref }}
        run: python3 -I .github/diagnostic-513/controller.py
