name: Collect startup control comparison

on:
  push:
    branches: [evidence/startup-control-sync-network-guard]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false
      - name: Guard the one new evidence publication
        env:
          INITIAL_CREATE: ${{ github.event.created }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$INITIAL_CREATE" = true
          test "$RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-list --parents -n 1 HEAD)" = "$EVENT_HEAD 993e3c7e2b2c4e10e9bcefae9f04d0948f2bfcfc"
          printf '%s\n' .github/workflows/startup-control-evidence.yml scripts/startup-evidence/collect.py > /tmp/expected-paths
          git diff --name-only HEAD^ HEAD > /tmp/actual-paths
          diff /tmp/expected-paths /tmp/actual-paths
      - name: Collect the two native WebKit runs once
        id: collect
        run: python3 scripts/startup-evidence/collect.py
      - name: Enforce the receipt upload bounds
        id: caps
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          files = [p for p in Path('startup-receipts').rglob('*') if p.is_file()]
          ok = (bool(files) and len(files) <= 192
                and sum(p.stat().st_size for p in files) <= 32 * 1024 * 1024
                and Path('startup-receipts/receipt.json').is_file())
          if not ok:
              print('INCOMPLETE: missing or oversized receipt set', file=sys.stderr)
              sys.exit(2)
          PY
      - name: Preserve raw native output and cleanup receipts
        if: always() && steps.caps.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: startup-control-comparison
          path: startup-receipts/
          retention-days: 1
          if-no-files-found: error
