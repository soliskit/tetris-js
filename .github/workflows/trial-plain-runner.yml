name: Trial plain runner

# One-week comparison, not a required check. Runs the same commands as the
# "test" job in pages.yml, on the plain runner with a browser install instead
# of the pinned Playwright container image. The Playwright package version is
# still checked; the container image cannot be, because this job has none.
# It never deploys.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-plain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Check Playwright package version
        run: node -e "process.exit(require('playwright/package.json').version==='1.64.1'?0:1)"
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
