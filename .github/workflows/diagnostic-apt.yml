name: Diagnostic - apt mirror throughput
on:
  workflow_dispatch:
    inputs:
      arm_order:
        description: 'Rotation index 0-3 for arm ordering'
        required: true
        type: string

permissions:
  contents: read

env:
  PACKAGES: >-
    libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64
    libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64
    libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1
    libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
    gstreamer1.0-libav gstreamer1.0-plugins-bad gstreamer1.0-plugins-base
    gstreamer1.0-plugins-good libicu74 libatomic1 libcairo-gobject2
    libenchant-2-2 libepoxy0 libevent-2.1-7t64 libflite1 libfontconfig1
    libfreetype6 libgdk-pixbuf-2.0-0 libgles2 libgstreamer-gl1.0-0
    libgstreamer-plugins-bad1.0-0 libgstreamer-plugins-base1.0-0
    libgstreamer1.0-0 libgtk-4-1 libharfbuzz-icu0 libharfbuzz0b
    libhyphen0 libjpeg-turbo8 liblcms2-2 libmanette-0.2-0 libopus0
    libpangocairo-1.0-0 libpng16-16t64 libsecret-1-0 libvpx9
    libwayland-client0 libwayland-egl1 libwayland-server0 libwebp7
    libwebpdemux2 libwoff1 libxml2 libxslt1.1 libx264-164 libavif16

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Validate input
        run: |
          case "${{ inputs.arm_order }}" in
            0|1|2|3) ;;
            *) echo "arm_order must be 0, 1, 2 or 3"; exit 1;;
          esac

      - name: Record environment
        run: |
          {
            echo "date_utc=$(date -u +%FT%TZ)"
            echo "image_version=$ImageVersion"
            echo "runner_name=$RUNNER_NAME"
            echo "arm_order=${{ inputs.arm_order }}"
            curl -sS --max-time 30 https://ipinfo.io/json || echo "ipinfo lookup failed"
          } | tee environment.txt

      - name: Capture original mirror baseline
        run: |
          sudo cp /etc/apt/apt-mirrors.txt /tmp/mirrors.orig
          test -s /tmp/mirrors.orig
          sudo cmp -s /tmp/mirrors.orig /etc/apt/apt-mirrors.txt
          grep -c '^http' /tmp/mirrors.orig | tee original-mirrorcount.txt
          grep 'azure\.archive\.ubuntu\.com' /tmp/mirrors.orig || echo "note: no azure entry in the original mirror list"

      - name: Resolve fixed package set (control manifest)
        run: |
          sudo apt-get update
          if ! apt-get install --download-only --reinstall --print-uris -y $PACKAGES > resolved-uris.txt 2>&1; then
            echo "control resolution command failed:"
            cat resolved-uris.txt
            exit 1
          fi
          grep -c "^'" resolved-uris.txt | tee uri-count.txt
          grep "^'" resolved-uris.txt | tr -d "'" | awk '{
            alg="none"; hash="";
            if ($4 ~ /^SHA256:[0-9a-fA-F]{64}$/) { alg="sha256"; hash=tolower(substr($4,8)) }
            else if ($4 ~ /^[A-Za-z0-9]+:/) { alg=$4; sub(/:.*/,"",alg) }
            print $2 "\t" $1 "\t" $3 "\t" alg "\t" hash
          }' | sort > expected-control.tsv
          test -s expected-control.tsv

      - name: Arms - per-arm resolution and timed downloads, rotated order
        run: |
          set +e
          RUN_OK=1
          restore_arm () {
            local rc_r=0
            sudo cp /tmp/mirrors.orig /etc/apt/apt-mirrors.txt || rc_r=$?
            if [ $rc_r -ne 0 ] || ! sudo cmp -s /tmp/mirrors.orig /etc/apt/apt-mirrors.txt; then
              rc_r=0
              sudo cp /tmp/mirrors.orig /etc/apt/apt-mirrors.txt || rc_r=$?
              if [ $rc_r -eq 0 ] && sudo cmp -s /tmp/mirrors.orig /etc/apt/apt-mirrors.txt; then
                echo "restore ok on retry" | tee -a results.txt
              else
                echo "RESTORE-FAILED: all remaining arms classified SETUP-INVALID (setup failure, not measurements)" | tee -a results.txt
                RUN_OK=0
              fi
            fi
          }
          run_arm () {
            local name="$1"; local mode="$2"
            if [ $RUN_OK -ne 1 ]; then
              echo "arm=${name} SETUP-INVALID: skipped after a prior restore failure (setup failure, not a measurement)" | tee -a results.txt
              return 0
            fi
            sudo apt-get clean
            local rc_prep=$?
            if [ $rc_prep -ne 0 ]; then
              echo "arm=${name} SETUP-INVALID: apt-get clean rc=${rc_prep} (setup failure, not a measurement)" | tee -a results.txt
              restore_arm
              return 0
            fi
            sudo rm -f /var/cache/apt/archives/*.deb
            rc_prep=$?
            if [ $rc_prep -ne 0 ]; then
              echo "arm=${name} SETUP-INVALID: archive removal rc=${rc_prep} (setup failure, not a measurement)" | tee -a results.txt
              restore_arm
              return 0
            fi
            local expected="/tmp/expected-mirrors.${name}"
            local ok=1
            if [ "$mode" = "keep" ]; then
              cp /tmp/mirrors.orig "$expected" || ok=0
            elif [ "$mode" = "remove-azure" ]; then
              grep -v 'azure\.archive\.ubuntu\.com' /tmp/mirrors.orig > "$expected"
              [ $? -le 1 ] || ok=0
            else
              grep 'azure\.archive\.ubuntu\.com' /tmp/mirrors.orig > "$expected"
              [ $? -le 1 ] || ok=0
            fi
            [ -s "$expected" ] || ok=0
            if [ $ok -eq 1 ]; then sudo cp "$expected" /etc/apt/apt-mirrors.txt || ok=0; fi
            if [ $ok -eq 1 ]; then sudo cmp -s "$expected" /etc/apt/apt-mirrors.txt || ok=0; fi
            if [ $ok -ne 1 ]; then
              echo "arm=${name} SETUP-INVALID: mirror prep verification failed (setup failure, not a measurement)" | tee -a results.txt
              restore_arm
              return 0
            fi
            grep -c '^http' /etc/apt/apt-mirrors.txt | tee "arm-${name}-mirrorcount.txt"
            if ! apt-get install --download-only --reinstall --print-uris -y $PACKAGES > "arm-${name}-uris.txt" 2>&1; then
              echo "arm=${name} SETUP-INVALID: resolution command failed (setup failure, not a measurement)" | tee -a results.txt
              restore_arm
              return 0
            fi
            grep "^'" "arm-${name}-uris.txt" | tr -d "'" | awk '{
                alg="none"; hash="";
                if ($4 ~ /^SHA256:[0-9a-fA-F]{64}$/) { alg="sha256"; hash=tolower(substr($4,8)) }
                else if ($4 ~ /^[A-Za-z0-9]+:/) { alg=$4; sub(/:.*/,"",alg) }
                print $2 "\t" $1 "\t" $3 "\t" alg "\t" hash
              }' | sort > "arm-${name}-manifest.tsv"
            if [ ! -s "arm-${name}-manifest.tsv" ]; then
              echo "arm=${name} SETUP-INVALID: empty resolution manifest (setup failure, not a measurement)" | tee -a results.txt
              restore_arm
              return 0
            fi
            wc -l < "arm-${name}-manifest.tsv" | tee "arm-${name}-manifest-count.txt"
            local start=$(date +%s)
            timeout --kill-after=60 1500 sudo apt-get install --download-only --reinstall -y $PACKAGES \
              > "arm-${name}.log" 2>&1
            local rc=$?
            local end=$(date +%s)
            local censor=""
            if [ $rc -eq 124 ] || [ $rc -eq 137 ]; then censor=" CENSORED(timeout)"; fi
            echo "arm=${name} mode=${mode} rc=${rc} seconds=$((end-start))${censor}" | tee -a results.txt
            grep -E '^(Need to get|Fetched) ' "arm-${name}.log" | tee -a results.txt
            restore_arm
            return 0
          }
          case "${{ inputs.arm_order }}" in
            0) run_arm default keep; run_arm bypass remove-azure; run_arm azureonly azure-only;;
            1) run_arm bypass remove-azure; run_arm azureonly azure-only; run_arm default keep;;
            2) run_arm azureonly azure-only; run_arm default keep; run_arm bypass remove-azure;;
            3) run_arm default keep; run_arm azureonly azure-only; run_arm bypass remove-azure;;
          esac
          exit 0

      - name: Curl control - largest SHA256-verifiable .deb, alternating hosts
        run: |
          set +e
          line=$(awk -F'\t' '$4=="sha256" && ($3+0)>0' expected-control.tsv | sort -t$'\t' -k3,3nr | head -1)
          if [ -z "$line" ]; then
            echo "no SHA256-verifiable object in the control manifest; control skipped (recorded)" | tee curl-results.txt
            exit 0
          fi
          c_name=$(printf '%s' "$line" | cut -f1)
          c_url=$(printf '%s' "$line" | cut -f2)
          c_size=$(printf '%s' "$line" | cut -f3)
          c_hash=$(printf '%s' "$line" | cut -f5)
          echo "object=${c_name} url=${c_url} expected_size=${c_size} alg=sha256 hash=${c_hash}" | tee curl-object.txt
          rel=$(printf '%s' "$c_url" | sed -n 's|^https\?://[^/]*/ubuntu/||p')
          if [ -z "$rel" ]; then
            echo "control URL outside expected /ubuntu/ path shape; control skipped" | tee curl-results.txt
            exit 0
          fi
          for i in 1 2 3 4 5 6; do
            if [ $((i % 2)) -eq 1 ]; then host="azure.archive.ubuntu.com"; else host="archive.ubuntu.com"; fi
            tmp="/tmp/obj-$i.deb"; rm -f "$tmp"
            if meta=$(curl -sS -o "$tmp" --max-time 600 \
                -w "http=%{http_code} bytes=%{size_download} seconds=%{time_total} Bps=%{speed_download}" \
                "http://${host}/ubuntu/${rel}" 2>"curl-err-$i.txt"); then rc=0; else rc=$?; fi
            http=$(printf '%s' "$meta" | sed -n 's/.*http=\([0-9][0-9]*\).*/\1/p')
            ok_http=0
            case "$http" in 2??) ok_http=1;; esac
            actual_size=0
            [ -f "$tmp" ] && actual_size=$(stat -c %s "$tmp")
            actual_sha=""
            if [ -s "$tmp" ]; then
              if s=$(sha256sum "$tmp"); then actual_sha=${s%% *}; fi
            fi
            rm -f "$tmp"
            if [ $rc -ne 0 ]; then
              verdict="invalid(curl-rc)"
            elif [ $ok_http -ne 1 ]; then
              verdict="invalid(http-status)"
            elif [ -z "$actual_sha" ]; then
              verdict="integrity-unverified(could-not-check): excluded from comparison"
            elif [ "$actual_sha" = "$c_hash" ]; then
              verdict="valid(sha256+http2xx)"
            else
              verdict="invalid(sha256-mismatch)"
            fi
            err=$(head -c 200 "curl-err-$i.txt"); rm -f "curl-err-$i.txt"
            echo "host=${host} attempt=${i} rc=${rc} ${meta} actual_size=${actual_size} verdict=${verdict} err=${err}" | tee -a curl-results.txt
          done
          exit 0

      - name: Validate measurement files
        run: |
          test -s results.txt && test -s curl-results.txt && test -s environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apt-mirror-probe-${{ inputs.arm_order }}
          path: |
            environment.txt
            original-mirrorcount.txt
            resolved-uris.txt
            uri-count.txt
            expected-control.tsv
            results.txt
            curl-results.txt
            curl-object.txt
            arm-*.log
            arm-*.tsv
            arm-*-mirrorcount.txt
          retention-days: 30
