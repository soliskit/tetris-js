name: Offline v6 candidate qualification
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths: ['.github/offline-qualification/**', '.github/workflows/offline-qualification.yml']
permissions:
  contents: read
concurrency:
  group: offline-v6-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  qualify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'offline-qualification-v6'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.0
      - name: Initialize explicit planned evidence before verification or setup
        env:
          OFFLINE_ENGINE: ${{ matrix.engine }}
          OFFLINE_HEAD: ${{ github.event.pull_request.head.sha }}
          OFFLINE_EVIDENCE: ${{ runner.temp }}/offline-evidence-${{ matrix.engine }}
        run: |
          python - <<'PYINIT'
          import os,json,pathlib
          root=pathlib.Path(os.environ['OFFLINE_EVIDENCE']);root.mkdir(exist_ok=False)
          cases=['install-offline-reload','persistent-offline-relaunch','legacy-takeover','foreign-cache-preservation','corrupt-install-rejected'] if os.environ['OFFLINE_ENGINE']=='chromium' else ['document-game-smoke']
          slots=[{'prefix':p,'name':n,'state':'not-started'} for p in ['/','/nested/app/'] for n in cases]
          (root/'planned.json').write_text(json.dumps({'engine':os.environ['OFFLINE_ENGINE'],'head':os.environ['OFFLINE_HEAD'],'slots':slots}))
          PYINIT
      - name: Verify frozen qualification sources
        shell: bash
        run: |
          set -euo pipefail
          echo 4bacf2c172360d96158027d9d515e47a84b5d46c04077b6b726971e29e6526ba  .github/offline-qualification/verify-inputs.py | sha256sum -c -
          echo 1542e3dff588fa71b5101c9d842d1ba622970f818c05f7319623a3619d2da630  .github/offline-qualification/inventory.json | sha256sum -c -
          python .github/offline-qualification/verify-inputs.py
      - name: Assemble temporary locked Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s npm ci --prefix .github/offline-qualification/ci-runtime --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Install hosted browser only
        shell: bash
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 300s node .github/offline-qualification/ci-runtime/node_modules/playwright/cli.js install --with-deps "$ENGINE"
      - name: Run one bounded qualification, no retry
        env:
          OFFLINE_ENGINE: ${{ matrix.engine }}
          OFFLINE_HEAD: ${{ github.event.pull_request.head.sha }}
          OFFLINE_EVIDENCE: ${{ runner.temp }}/offline-evidence-${{ matrix.engine }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 900s python .github/offline-qualification/supervise.py
      - name: Emit available evidence to nonartifact job logs
        if: always()
        env:
          OFFLINE_ENGINE: ${{ matrix.engine }}
          OFFLINE_HEAD: ${{ github.event.pull_request.head.sha }}
          OFFLINE_EVIDENCE: ${{ runner.temp }}/offline-evidence-${{ matrix.engine }}
        run: python .github/offline-qualification/emit-evidence.py
