<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tetris</title>
  <meta name="theme-color" content="#4b0082">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tetris">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div class="scores glass">
      <div id="score" class="score">Score: 0</div>
      <div id="highScore" class="high-score">High Score: 0</div>
    </div>

    <div class="previews">
      <canvas id="heldPreview" class="preview glass" width="120" height="120" title="Hold"></canvas>
      <div class="next">
        <canvas id="next0" class="preview glass" width="120" height="120"></canvas>
        <canvas id="next1" class="preview small glass" width="88" height="88"></canvas>
        <canvas id="next2" class="preview small glass" width="88" height="88"></canvas>
      </div>
    </div>

    <div class="board glass">
      <canvas id="tetris" width="300" height="600"></canvas>
    </div>

    <div class="controls">
      <div id="gameOverControls">
        <div class="buttons">
          <button id="newGameButton" class="glass">New Game</button>
          <button id="continueGameButton" class="glass">Continue</button>
        </div>
        <p id="keyHint" class="hint">Return: New Game</p>
      </div>
      <button id="playPauseButton" class="glass round" aria-label="Pause">&#10074;&#10074;</button>
    </div>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
